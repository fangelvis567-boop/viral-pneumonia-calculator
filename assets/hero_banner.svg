<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" preserveAspectRatio="xMidYMid slice">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3d91"/>
      <stop offset="55%" stop-color="#1a6db0"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="1400" height="240" fill="url(#bgGrad)"/>
  <rect width="1400" height="240" fill="url(#gridPat)"/>
  <ellipse cx="280" cy="120" rx="380" ry="200" fill="url(#glowGrad)"/>
  <ellipse cx="1100" cy="120" rx="320" ry="180" fill="url(#glowGrad)"/>

  <!-- 左侧：肺部轮廓 + 病毒标记（极简线稿） -->
  <g transform="translate(60,40) scale(0.85)" stroke="#ffffff" fill="none" stroke-width="2.2" opacity="0.92">
    <!-- 气管 -->
    <line x1="100" y1="0" x2="100" y2="40"/>
    <!-- 主支气管分叉 -->
    <path d="M100,40 Q60,55 50,80" />
    <path d="M100,40 Q140,55 150,80" />
    <!-- 左肺 -->
    <path d="M50,80 Q15,110 12,160 Q15,200 55,210 Q90,210 95,170 Q92,120 50,80 Z" stroke-width="2.5"/>
    <!-- 右肺 -->
    <path d="M150,80 Q185,110 188,160 Q185,200 145,210 Q110,210 105,170 Q108,120 150,80 Z" stroke-width="2.5"/>
    <!-- 肺泡纹理 -->
    <circle cx="40" cy="135" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="55" cy="155" r="2.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="70" cy="180" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="160" cy="135" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="145" cy="155" r="2.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="130" cy="180" r="3" fill="#ffffff" opacity="0.6"/>
    <!-- 病毒颗粒（简化六角晕） -->
    <g transform="translate(115,110)" opacity="0.88">
      <circle r="9" fill="#ff6b6b" opacity="0.85"/>
      <g stroke="#ff6b6b" stroke-width="1.5" fill="none">
        <line x1="0" y1="-9" x2="0" y2="-15"/>
        <line x1="0" y1="9" x2="0" y2="15"/>
        <line x1="-9" y1="0" x2="-15" y2="0"/>
        <line x1="9" y1="0" x2="15" y2="0"/>
        <line x1="-7" y1="-7" x2="-12" y2="-12"/>
        <line x1="7" y1="-7" x2="12" y2="-12"/>
        <line x1="-7" y1="7" x2="-12" y2="12"/>
        <line x1="7" y1="7" x2="12" y2="12"/>
      </g>
      <circle cx="0" cy="-15" r="2" fill="#ff6b6b"/>
      <circle cx="0" cy="15" r="2" fill="#ff6b6b"/>
      <circle cx="-15" cy="0" r="2" fill="#ff6b6b"/>
      <circle cx="15" cy="0" r="2" fill="#ff6b6b"/>
    </g>
  </g>

  <!-- 中部：心电波形 + 数据点 -->
  <g transform="translate(280,135)" stroke="#a8e6cf" stroke-width="2" fill="none" opacity="0.85">
    <path d="M0,0 L40,0 L50,-10 L60,30 L70,-40 L80,15 L95,0 L150,0 L160,-8 L170,20 L180,-25 L190,10 L205,0 L260,0 L270,-12 L280,35 L290,-45 L300,18 L315,0 L380,0"/>
  </g>

  <!-- 中部：标题 -->
  <g font-family="'Source Han Sans CN','PingFang SC','Microsoft YaHei',sans-serif" fill="#ffffff">
    <text x="700" y="100" font-size="38" font-weight="700" text-anchor="middle" letter-spacing="2">病毒性肺炎重症风险预测</text>
    <text x="700" y="138" font-size="16" font-weight="400" text-anchor="middle" letter-spacing="3" opacity="0.92">
      Viral Pneumonia Severity Risk Calculator
    </text>
    <text x="700" y="178" font-size="13" text-anchor="middle" opacity="0.78" letter-spacing="1.5">
      多中心 642 例 · Logistic + XGBoost 双模型对比 · SHAP 个体化解释
    </text>
    <line x1="540" y1="195" x2="860" y2="195" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- 右侧：神经网络节点（AI 隐喻） -->
  <g transform="translate(1110,30)" opacity="0.75">
    <!-- 输入层 -->
    <g fill="#ffffff">
      <circle cx="0" cy="40" r="6"/>
      <circle cx="0" cy="80" r="6"/>
      <circle cx="0" cy="120" r="6"/>
      <circle cx="0" cy="160" r="6"/>
    </g>
    <!-- 隐藏层 -->
    <g fill="#ffd166">
      <circle cx="80" cy="20" r="7"/>
      <circle cx="80" cy="65" r="7"/>
      <circle cx="80" cy="115" r="7"/>
      <circle cx="80" cy="160" r="7"/>
      <circle cx="80" cy="200" r="7"/>
    </g>
    <!-- 输出层 -->
    <g fill="#ff6b6b">
      <circle cx="170" cy="80" r="9"/>
      <circle cx="170" cy="130" r="9"/>
    </g>
    <!-- 连线 -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.45">
      <line x1="0" y1="40" x2="80" y2="20"/><line x1="0" y1="40" x2="80" y2="65"/><line x1="0" y1="40" x2="80" y2="115"/>
      <line x1="0" y1="80" x2="80" y2="20"/><line x1="0" y1="80" x2="80" y2="65"/><line x1="0" y1="80" x2="80" y2="115"/><line x1="0" y1="80" x2="80" y2="160"/>
      <line x1="0" y1="120" x2="80" y2="65"/><line x1="0" y1="120" x2="80" y2="115"/><line x1="0" y1="120" x2="80" y2="160"/><line x1="0" y1="120" x2="80" y2="200"/>
      <line x1="0" y1="160" x2="80" y2="115"/><line x1="0" y1="160" x2="80" y2="160"/><line x1="0" y1="160" x2="80" y2="200"/>
      <line x1="80" y1="20" x2="170" y2="80"/><line x1="80" y1="65" x2="170" y2="80"/><line x1="80" y1="115" x2="170" y2="80"/><line x1="80" y1="115" x2="170" y2="130"/>
      <line x1="80" y1="160" x2="170" y2="130"/><line x1="80" y1="200" x2="170" y2="130"/>
    </g>
  </g>
</svg>
